name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Lint PHP files
        run: |
          php -l content-extractor.php
          php -l functions.php

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: |
          git fetch --tags --force
          git tag -l

      - name: Get version from plugin file
        id: get_version
        run: |
          VERSION=$(php -r '
            $header = file_get_contents("content-extractor.php");
            if (preg_match("/^\s*\*\s*Version:\s*([0-9]+\.[0-9]+\.[0-9]+)/mi", $header, $m)) {
              echo $m[1];
            }
          ')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract semver Version from plugin header"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          echo "Checking for tag: $TAG"
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping release creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, will create release"
          fi

      - name: Create Release
        if: steps.get_version.outputs.version != '' && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: WP Content Extractor v${{ steps.get_version.outputs.version }}
          body: |
            ## WP Content Extractor v${{ steps.get_version.outputs.version }}

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ### Installation
            1. Download the plugin ZIP from the releases page
            2. Upload to WordPress via Plugins → Add New → Upload Plugin
            3. Activate the plugin
            4. Configure via Settings → Content Extractor

            ### Requirements
            - WordPress 5.0+
            - PHP 7.4+
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched: false
